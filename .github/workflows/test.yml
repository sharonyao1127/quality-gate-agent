name: Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate quality gate outputs
        if: github.event_name != 'pull_request'
        run: |
          python -m src.main

      - name: Analyze pull request and publish comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main \
            --github-repository "${{ github.repository }}" \
            --github-pr "${{ github.event.pull_request.number }}" \
            --publish-comment

      - name: Run eval cases
        run: |
          python -m src.eval_runner

      - name: Run tests
        run: |
          pytest -q

      - name: Upload quality gate outputs
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-outputs
          path: outputs/
