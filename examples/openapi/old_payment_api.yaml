openapi: 3.0.0
info:
  title: Generic Payment API
  version: 1.0.0
paths:
  /payments/process:
    post:
      summary: Process payment
      responses:
        "200":
          description: Payment processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processing, completed, failed]
